<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QR CODE | طباعة · تطريز · ليزر</title>
<meta name="description" content="QR CODE للطباعة والتطريز والليزر — تشيرتات، أوشحة تخرج، باجات تعريفية، أقلام مطبوعة، وسجاد Tufting بتصميم مخصص." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // يظهر رمز العملة فقط بعد التأكد من نجاح تحميل الخط فعليًا،
  // وبعدها يتم التبديل تلقائيًا بين الرمز والنص "د.ع" كل ثانية
  if ("fonts" in document) {
    document.fonts.load('16px "GoldDinarCurrency"').then(function (loaded) {
      if (loaded && loaded.length > 0) {
        document.documentElement.classList.add("currency-font-ready");
        setInterval(function () {
          document.documentElement.classList.toggle("currency-show-text");
        }, 1000);
      }
    }).catch(function () { /* يبقى النص الاحتياطي د.ع كما هو، بدون أي تبديل */ });
  }
</script>
</head>
<body>

<div id="loading" class="loading-page">
  <div class="spinner"></div>
  <p>جارِ تحميل المتجر...</p>
</div>

<div id="app" style="display:none;"></div>

<div id="modalBg" class="modal-bg"></div>
<div id="toastHost"></div>
<button id="themeToggle" class="theme-toggle" title="الوضع الليلي/النهاري">🌙</button>

<script src="script.js"></script>
</body>
</html>
