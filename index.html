<script>
  // إذا فشل تحميل مكتبة Supabase (شبكة ضعيفة/بطيئة أو حجب المصدر)، نظهر رسالة خطأ فورًا
  // بدل ما تبقى شاشة "جارِ تحميل المتجر" عالقة للأبد بدون أي تفسير للزبون
  function showStoreLoadError(){
    var el = document.getElementById("loading");
    if (!el || el.dataset.errorShown === "1") return;
    el.dataset.errorShown = "1";
    el.innerHTML =
      '<p style="font-weight:700;margin-bottom:10px;">تعذر تحميل المتجر</p>' +
      '<p style="color:#8a8f98;font-size:13px;margin-bottom:18px;">تأكد من اتصالك بالإنترنت ثم أعد المحاولة</p>' +
      '<button onclick="location.reload()" style="border:2px solid currentColor;background:none;padding:10px 22px;border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;">إعادة المحاولة</button>';
  }
  // مهلة أمان: إذا بعد 12 ثانية ما زالت شاشة التحميل ظاهرة لأي سبب، نظهر نفس رسالة الخطأ
  setTimeout(function(){
    var el = document.getElementById("loading");
    if (el && el.style.display !== "none") showStoreLoadError();
  }, 12000);
  // شبكة أمان أخيرة: أي خطأ غير متوقع بأي مكان بالكود يظهر نفس رسالة الخطأ بدل شاشة عالقة بصمت
  window.addEventListener("error", function(){
    var el = document.getElementById("loading");
    if (el && el.style.display !== "none") showStoreLoadError();
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showStoreLoadError()"></script>

<div id="loading" class="loading-page">

</div>
