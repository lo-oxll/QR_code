<script>
  // إذا فشل تحميل مكتبة Supabase (شبكة ضعيفة/بطيئة أو حجب المصدر)، نظهر رسالة خطأ فورًا
  // بدل ما تبقى شاشة "جارِ تحميل المتجر" عالقة للأبد بدون أي تفسير للزبون
  function showStoreLoadError(){
    var el = document.getElementById("loading");
    if (!el || el.dataset.errorShown === "1") return;
    el.dataset.errorShown = "1";
    el.innerHTML =
      '<p style="font-weight:700;margin-bottom:10px;">تعذر تحميل المتجر</p>' +
      '<p style="color:#8a8f98;font-size:13px;margin-bottom:18px;">تأكد من اتصالك بالإنترنت ثم أعد المحاولة</p>' +
      '<button onclick="location.reload()" style="border:2px solid currentColor;background:none;padding:10px 22px;border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;">إعادة المحاولة</button>';
  }
  // مهلة أمان: إذا بعد 12 ثانية ما زالت شاشة التحميل ظاهرة لأي سبب، نظهر نفس رسالة الخطأ
  setTimeout(function(){
    var el = document.getElementById("loading");
    if (el && el.style.display !== "none") showStoreLoadError();
  }, 12000);
  // شبكة أمان أخيرة: أي خطأ غير متوقع بأي مكان بالكود (بما فيها فشل تحميل ملف مثل script.js نفسه)
  // يظهر نفس رسالة الخطأ فورًا بدل انتظار مهلة الـ12 ثانية. useCapture=true ضروري هنا لأن أخطاء
  // تحميل الموارد (script/link/img) لا تصعد (bubble) عبر DOM، فيجب التقاطها بمرحلة الالتقاط (capture).
  window.addEventListener("error", function(){
    var el = document.getElementById("loading");
    if (el && el.style.display !== "none") showStoreLoadError();
  }, true);
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="showStoreLoadError()"></script>
<script>
  // تسجيل Service Worker لتفعيل تحميل أسرع من الكاش وعمل جزئي بدون إنترنت.
  // لا علاقة له ببيانات المنتجات/الطلبات (تُستثنى صراحة داخل sw.js وتبقى مباشرة من Supabase دائمًا)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch((err) => {
        // على iOS، فتح الرابط داخل متصفح مدمج بتطبيق (إنستغرام/واتساب/تيك توك) يمنع تسجيل
        // Service Worker برسالة "non app-bound domain" — هذا متوقع وغير ضار، باقي الموقع يعمل طبيعي
        console.warn("Service Worker غير متاح بهذا المتصفح (على الأغلب متصفح داخلي بتطبيق آخر):", err.message || err);
      });
    });
  }
</script>

  </button>

</div>
